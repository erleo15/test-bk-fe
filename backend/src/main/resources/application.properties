# BASE DE DATOS MYSQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${MYSQL_USER:root}
quarkus.datasource.password=${MYSQL_PASSWORD:ABCD123abcd.}
quarkus.datasource.jdbc.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:test_bk_fe}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil&createDatabaseIfNotExist=true
quarkus.datasource.jdbc.driver=com.mysql.cj.jdbc.Driver
# HIBERNATE
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.timezone=America/Guayaquil
# SWAGGER
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=/.*/
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS
quarkus.http.host=0.0.0.0
# LOGs
quarkus.log.level=INFO
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{3}] (%t) %s%e%n
quarkus.log.console.level=DEBUG
# Archivo de Logs
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/tech-test.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{3}] (%t) %s%e%n
quarkus.log.file.level=DEBUG
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.category."ec.com.test".level=DEBUG
quarkus.log.category."org.hibernate.SQL".level=INFO
